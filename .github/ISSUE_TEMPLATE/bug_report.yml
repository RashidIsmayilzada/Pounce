name: Bug report
description: Something in Pounce doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't paste private file contents; describe the kind of file instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I pressed the shortcut, searched "tax return" and expected my PDF, but…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pounce version
      description: From the release you downloaded, or `pounce --version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and computer
      description: The system and its version (on Windows, `winver` shows it), and the computer or its processor and memory
      placeholder: macOS 26.5 on a MacBook Air M2 8 GB, or Windows 11 24H2 on an x64 laptop with 16 GB
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        The last lines of the Engine log, and on Windows also of the Launcher log. Check them for private paths first.
        - macOS: `~/Library/Application Support/Pounce/logs/engine.log`
        - Windows: `%LOCALAPPDATA%\Pounce\logs\engine.log` and `%LOCALAPPDATA%\Pounce\logs\launcher.log`
      render: text
