# Builds, tests, smoke-checks and publishes Pounce for macOS and Windows as one GitHub Release.
# Start it either way:
#   - push a tag:        git tag v0.2.0 && git push origin v0.2.0
#   - or from GitHub:    Actions → Release → Run workflow → enter 0.2.0 (creates the tag on the chosen branch)
# The release notes are that version's section of CHANGELOG.md, which must exist.
# The macOS and Windows builds run side by side and hand their zips over as workflow artifacts. The release is created
# from the macOS build alone (and the Homebrew cask follows it), so the macOS release never waits for Windows; the
# Windows zip is attached to it afterwards, only once the Windows build passed its smoke check. When the Windows build
# fails, the release is a normal macOS release and the windows job is red; fix the cause and use "Re-run failed jobs",
# which builds Windows again and attaches its zip to the existing release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (needs a "## [0.2.0]" section in CHANGELOG.md)'
        required: true

concurrency: release

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' is not a version like 1.2.3"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          retention-days: 7
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: model-bge-small-en-v1.5-int8-${{ hashFiles('scripts/fetch-model.sh') }}

      - name: Fetch the embedding model
        run: '[ -f models/bge-small-en-v1.5/model.onnx ] || scripts/fetch-model.sh'

      - name: Engine and CLI tests
        run: mvn -B -ntp verify

      - name: Launcher tests
        working-directory: macos-app
        run: swift test

      - name: Build Pounce.app
        env:
          POUNCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: JAVA_HOME_25="$JAVA_HOME" scripts/build-app.sh

      - name: Smoke-check the built app
        run: scripts/smoke-app.sh

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          zip="Pounce-$VERSION-macos-arm64.zip"
          ditto -c -k --keepParent build/Pounce.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true   # a re-run replaces the zip of the attempt before

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows-app/global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: model-bge-small-en-v1.5-int8-${{ hashFiles('scripts/fetch-model.sh') }}

      - name: Fetch the embedding model
        shell: bash
        run: '[ -f models/bge-small-en-v1.5/model.onnx ] || scripts/fetch-model.sh'

      - name: Engine and CLI tests
        run: mvn -B -ntp verify

      - name: Launcher tests
        working-directory: windows-app
        run: dotnet test

      - name: Build Pounce for Windows
        shell: bash
        env:
          POUNCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/build-windows.sh

      - name: Smoke-check the Windows build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            build/Pounce-${{ needs.prepare.outputs.version }}-windows-x64.zip
            build/Pounce-${{ needs.prepare.outputs.version }}-windows-x64.zip.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true   # a re-run replaces the zip of the attempt before

  # The release itself: the macOS build only, as before Windows existed. Needs nothing from the windows job.
  publish:
    needs: [prepare, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: dist

      - name: Check the downloaded zip
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: dist
        run: |
          ls -l
          sha256sum -c "Pounce-$VERSION-macos-arm64.zip.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/Pounce-$VERSION-macos-arm64.zip" "dist/Pounce-$VERSION-macos-arm64.zip.sha256" \
            --title "Pounce $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  homebrew:
    needs: [prepare, publish]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  # Runs only when the release exists and the Windows build passed its smoke check (a skipped or failed need skips it).
  # --clobber: a re-run replaces what an earlier attempt attached.
  attach-windows:
    needs: [prepare, publish, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: dist

      - name: Check the downloaded zip
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: dist
        run: |
          ls -l
          sha256sum -c "Pounce-$VERSION-windows-x64.zip.sha256"

      - name: Attach the Windows zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v$VERSION" --clobber \
            "dist/Pounce-$VERSION-windows-x64.zip" "dist/Pounce-$VERSION-windows-x64.zip.sha256"
