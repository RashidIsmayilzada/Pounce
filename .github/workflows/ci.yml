# Runs every test on each push to main and each pull request.
# macOS runner: the file-watcher tests use FSEvents and the Launcher is a Swift/AppKit package.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: model-bge-small-en-v1.5-int8-${{ hashFiles('scripts/fetch-model.sh') }}

      - name: Fetch the embedding model
        run: '[ -f models/bge-small-en-v1.5/model.onnx ] || scripts/fetch-model.sh'

      - name: Engine and CLI tests
        run: mvn -B -ntp verify

      - name: Launcher tests
        working-directory: macos-app
        run: swift test

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
